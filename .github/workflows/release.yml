# [Blur2PC][x64] Builds the player release (the engine's Master configuration,
# CMake MinSizeRel) and publishes it as a GitHub release. The zip holds what
# package.bat produces locally: BlurRebuilt.exe, AmaxClientHost.exe, README.md
# the fx11 effects (effects.index, effects.samplers and .fxo files), and the
# pinned InputFusion DLL with its accompanying notices.
#
# Start it by pushing a tag (git push rebuilt v1.0), or from the Actions tab
# with a tag name, which creates the tag on the selected commit.
name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Preview tag to create (for example v2.0.0-preview.1)
        required: true
      publish:
        description: Create a draft preview release after package checks pass
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2025
    timeout-minutes: 240
    env:
      TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || format('preview-{0}', github.sha) }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate package version
        run: |
          if ($env:TAG -notmatch '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$') { throw 'Invalid package version' }

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Find Visual Studio
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $major = (& $vswhere -latest -products * -property installationVersion).Split('.')[0]
          $generator = @{ '18' = 'Visual Studio 18 2026'; '17' = 'Visual Studio 17 2022' }[$major]
          if (-not $generator) { throw "Unsupported Visual Studio version $major at $vs" }
          $cmake = Join-Path $vs 'Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin\cmake.exe'
          if (-not (Test-Path $cmake)) { $cmake = (Get-Command cmake).Source }
          Write-Host "Visual Studio $major at $vs; $generator; $cmake"
          "BLUR_GENERATOR=$generator" >> $env:GITHUB_ENV
          "BLUR_CMAKE=$cmake" >> $env:GITHUB_ENV

      # Third-party inputs (docs/agent-reference/build.md, docs/blur1pcdx11/x64.md).
      # The exe uses none of OpenAL at run time (audio is DirectSound), but the
      # engine's Audio.h still includes al.h, alc.h and efx.h.
      - name: Download vendor packages
        run: |
          $ErrorActionPreference = 'Stop'
          $dl = '_work/vendor_dl'
          $vendor = '_work/vendor'
          New-Item -ItemType Directory -Force $dl, $vendor | Out-Null
          function Get-Checked($urls, $file, $sha1) {
            foreach ($url in $urls) {
              # curl: SourceForge answers PowerShell's user agent with an HTML page.
              curl.exe -fsSL --retry 3 --retry-delay 10 -o "$dl/$file" $url
              if ($LASTEXITCODE -eq 0) { break }
              Write-Host "Download failed from $url"
            }
            $actual = (Get-FileHash "$dl/$file" -Algorithm SHA1).Hash
            if ($actual -ne $sha1) { throw "$file SHA1 $actual, expected $sha1" }
          }
          Get-Checked @('https://www.nuget.org/api/v2/package/Microsoft.DXSDK.D3DX/9.29.952.8') d3dx.zip B4A86540D0E52C014BCD41A7499C31BA6252D2F7
          Expand-Archive "$dl/d3dx.zip" "$vendor/d3dx"
          Get-Checked @('https://github.com/kcat/openal-soft/releases/download/1.24.3/openal-soft-1.24.3-bin.zip') openal.zip BB1245E3E0809370EADF7121A8B626F7132AA358
          Expand-Archive "$dl/openal.zip" $vendor
          Get-Checked @('https://downloads.sourceforge.net/project/libjpeg/libjpeg/6b/jpegsrc.v6b.tar.gz', 'https://www.ijg.org/files/jpegsrc.v6b.tar.gz') jpeg.tar.gz 7079F0D6C42FAD0CFBA382CF6AD322ADD1ACE8F9
          tar -xzf "$dl/jpeg.tar.gz" -C $vendor
          if (-not (Test-Path "$vendor/jpeg-6b/jpeglib.h") -or -not (Test-Path "$vendor/openal-soft-1.24.3-bin/include/AL/al.h") -or -not (Test-Path "$vendor/d3dx/build/native/include")) { throw 'Vendor layout differs from blur_common.cmake' }

      - name: Restore x64 OpenSSL
        id: openssl
        uses: actions/cache/restore@v4
        with:
          path: _work/vendor_x64/openssl-x64
          key: openssl-0.9.8i-x64-${{ hashFiles('tools/demonware_cmake/build_openssl_x64.cmd') }}

      - name: Build x64 OpenSSL 0.9.8i
        if: steps.openssl.outputs.cache-hit != 'true'
        run: |
          $ErrorActionPreference = 'Stop'
          $dl = '_work/vendor_x64/dl'
          New-Item -ItemType Directory -Force $dl | Out-Null
          curl.exe -fsSL --retry 3 --retry-delay 10 -o "$dl/openssl.tar.gz" https://www.openssl.org/source/old/0.9.x/openssl-0.9.8i.tar.gz
          $actual = (Get-FileHash "$dl/openssl.tar.gz" -Algorithm SHA1).Hash
          if ($actual -ne 'B2E029CFB68BF32EAE997D60317A40945DB5A65F') { throw "openssl SHA1 $actual" }
          # The tarball's include/openssl entries are symlinks that Windows tar
          # cannot create; the build copies the real headers into inc32.
          tar -xzf "$dl/openssl.tar.gz" -C _work/vendor_x64
          if (-not (Test-Path _work/vendor_x64/openssl-0.9.8i/Configure)) { throw 'OpenSSL source did not extract' }
          $global:LASTEXITCODE = 0
          cmd /c "tools\demonware_cmake\build_openssl_x64.cmd _work\vendor_x64\openssl-0.9.8i _work\vendor_x64\openssl-x64"
          if ($LASTEXITCODE -ne 0) { throw "build_openssl_x64.cmd exited $LASTEXITCODE" }

      - name: Save verified OpenSSL dependency
        if: steps.openssl.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: _work/vendor_x64/openssl-x64
          key: ${{ steps.openssl.outputs.cache-primary-key }}

      - name: Prepare pinned controller backend
        run: ./tools/inputfusion/setup.ps1

      # The commands in tools/build.sh, configured for x64.
      - name: Generate build files
        run: |
          $ErrorActionPreference = 'Stop'
          $J = 'tools/jam2cmake'
          New-Item -ItemType Directory -Force _work/build | Out-Null
          function Invoke-Py { python @args; if ($LASTEXITCODE -ne 0) { throw "python $args exited $LASTEXITCODE" } }
          Invoke-Py "$J/jamextract.py" --top . --root code/amax/game/jamfile.jam --target WIN32 --platform PC --build Speed --out _work/build/targets_pc_speed.json
          $cp = Get-ChildItem code/mercury/library, code/amax/game -Recurse -File -Include *.cp, *.cv, *.sp | ForEach-Object FullName
          Invoke-Py "$J/cpgen.py" @cp
          Invoke-Py "$J/shadergen.py" --json _work/build/targets_pc_speed.json --out _work/build/gen/shaders
          Invoke-Py "$J/luabundle.py" --json _work/build/targets_pc_speed.json --out _work/build/gen/blobs/amax_lua_bundle.cpp
          Invoke-Py "$J/gen_cmake.py" --json _work/build/targets_pc_speed.json --out cmake/targets.cmake
          git diff --ignore-cr-at-eol --exit-code --stat -- cmake/targets.cmake
          if ($LASTEXITCODE -ne 0) { Write-Host '::warning::cmake/targets.cmake differs from the jamfiles; building the regenerated one' }

      # The fxc.exe cmake/dx11.cmake picks: the newest Windows SDK that has one.
      - name: Identify fxc
        run: |
          $fxc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x86\fxc.exe" |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending | Select-Object -First 1
          if (-not $fxc) { throw 'fxc.exe not found' }
          $id = (Get-FileHash $fxc.FullName -Algorithm SHA1).Hash.Substring(0, 12)
          Write-Host "$($fxc.FullName) $id"
          "BLUR_FXC_ID=$id" >> $env:GITHUB_ENV

      # Compiled DX11 effects and built-in shaders from an earlier run with the
      # same inputs. The key hashes everything cmake/dx11.cmake lists as a shader
      # dependency (after Generate build files has written the .cp/.cv/.sp headers),
      # so only an exact match is restored and the build then skips the shader
      # compile (BLUR_BUILD_SHADERS=OFF). The compiler's --skip-existing compares
      # timestamps, which a fresh checkout makes newer than any restored output.
      - name: Restore compiled shaders
        id: shaders
        uses: actions/cache/restore@v4
        with:
          path: |
            _work/build/gen/fx11
            _work/build/gen/dx11_builtins
          key: dx11-shaders-${{ env.BLUR_FXC_ID }}-${{ hashFiles('code/amax/game/**/*.fx', 'code/amax/game/**/*.vsh', 'code/amax/game/**/*.psh', 'code/amax/game/**/*.h', 'code/amax/game/**/*.jam', 'code/mercury/library/**/*.jam', 'code/mercury/library/graphics/**/*.fx', 'code/mercury/library/graphics/**/*.vsh', 'code/mercury/library/graphics/**/*.psh', 'code/mercury/library/graphics/**/*.h', 'code/mercury/library/graphics/**/*.samplers', 'code/mercury/library/ui/**/*.vsh', 'code/mercury/library/ui/**/*.psh', 'code/mercury/library/ui/**/*.h', 'tools/dx11_fxcompile/*.py', 'tools/dx11_shadercompile/*.py', 'tools/jam2cmake/jamextract.py', 'tools/jam2cmake/cpgen.py', 'cmake/dx11.cmake') }}

      - name: Build Master Amax.exe and fx11
        env:
          BLUR_BUILD_SHADERS: ${{ steps.shaders.outputs.cache-hit == 'true' && 'OFF' || 'ON' }}
        run: |
          Write-Host "BLUR_BUILD_SHADERS=$env:BLUR_BUILD_SHADERS"
          & $env:BLUR_CMAKE -S . -B _work/build/vs -G $env:BLUR_GENERATOR -A x64 "-DBLUR_BUILD_SHADERS=$env:BLUR_BUILD_SHADERS"
          if ($LASTEXITCODE -ne 0) { throw "configure exited $LASTEXITCODE" }
          & $env:BLUR_CMAKE --build _work/build/vs --config MinSizeRel --target Amax -- -m '-v:m' -nologo *> _work/build/amax.log
          $code = $LASTEXITCODE
          python tools/jam2cmake/errsum.py _work/build/amax.log
          if ($code -ne 0) { Get-Content _work/build/amax.log -Tail 60; throw "build exited $code" }

      - name: Save verified compiled shaders
        if: steps.shaders.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            _work/build/gen/fx11
            _work/build/gen/dx11_builtins
          key: ${{ steps.shaders.outputs.cache-primary-key }}

      - name: Package
        run: |
          $package = ./tools/installer/package.ps1 -Version $env:TAG -Configuration MinSizeRel
          "BLUR_STAGE=$($package.Stage)" >> $env:GITHUB_ENV
          "BLUR_ZIP=$($package.Zip)" >> $env:GITHUB_ENV

      - name: Build offline installer and fixture
        run: |
          ./tools/installer/build.ps1 -Stage $env:BLUR_STAGE -Version $env:TAG -OutputDirectory _work/release
          ./tools/installer/build.ps1 -Stage $env:BLUR_STAGE -Version $env:TAG -OutputDirectory _work/release -InstallerTest
          $setup = "_work/release/BlurDX11V2-$env:TAG-Setup.exe"
          $fixture = "_work/release/BlurDX11V2-$env:TAG-Setup-Fixture.exe"
          if (!(Test-Path $setup) -or !(Test-Path $fixture)) { throw 'Installer build incomplete' }
          "BLUR_SETUP=$setup" >> $env:GITHUB_ENV
          "BLUR_FIXTURE=$fixture" >> $env:GITHUB_ENV

      - name: Test setup and legacy upgrade
        run: |
          # Install prerequisites explicitly on this disposable hosted runner.
          $dependencies = ./tools/installer/prepare.ps1
          $runtime = Start-Process $dependencies.Redist -ArgumentList '/install /quiet /norestart' -Wait -PassThru -WindowStyle Hidden
          if ($runtime.ExitCode -notin 0,3010,1638) { throw "Runtime installation failed $($runtime.ExitCode)" }
          $legacy = '_work/legacy-installer/tools/installer'
          New-Item -ItemType Directory -Force $legacy | Out-Null
          foreach ($name in @('setup.iss','build.ps1','prepare.ps1')) {
            git show "8606c57d1cfa16427d268a46048c80dd1af5837b:tools/installer/$name" | Set-Content "$legacy/$name" -Encoding utf8
            if ($LASTEXITCODE -ne 0) { throw "Missing legacy installer $name" }
          }
          & "$legacy/build.ps1" -Stage $env:BLUR_STAGE -Version legacy-test -OutputDirectory _work/release -InstallerTest -InnoCompiler $dependencies.Compiler -RedistPath $dependencies.Redist
          ./tools/installer/test.ps1 -Setup $env:BLUR_FIXTURE -PreviousSetup _work/release/BlurRebuilt-legacy-test-Setup-Fixture.exe

      - name: Create release checksums
        run: |
          $assets = @($env:BLUR_SETUP, $env:BLUR_ZIP, "$env:BLUR_SETUP.json")
          $assets | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_ -Algorithm SHA256).Hash.ToLower()
            "$hash  $([IO.Path]::GetFileName($_))"
          } | Set-Content _work/release/SHA256SUMS.txt -Encoding ascii

      - name: Keep release candidates
        uses: actions/upload-artifact@v4
        with:
          name: BlurDX11V2-${{ env.TAG }}
          path: |
            ${{ env.BLUR_SETUP }}
            ${{ env.BLUR_SETUP }}.json
            ${{ env.BLUR_ZIP }}
            _work/release/SHA256SUMS.txt
          if-no-files-found: error

      - name: Create draft preview
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $existing = gh release view $env:TAG --json tagName --jq .tagName 2>$null
          if ($LASTEXITCODE -eq 0 -and $existing -eq $env:TAG) {
            Write-Host 'A release already exists for this tag. This candidate is retained in the workflow artifacts.'
          } else {
            gh release create $env:TAG $env:BLUR_SETUP "$env:BLUR_SETUP.json" $env:BLUR_ZIP _work/release/SHA256SUMS.txt --target $env:GITHUB_SHA --title "Blur DX11 V2 $env:TAG" --notes-file docs/blur1pcdx11/preview-release.md --draft --prerelease
            if ($LASTEXITCODE -ne 0) { throw "gh release create exited $LASTEXITCODE" }
          }

      - name: Keep the build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: _work/build/amax.log
          if-no-files-found: ignore
